services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weeto
      POSTGRES_PASSWORD: weeto
      POSTGRES_DB: weeto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weeto -d weeto"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/kukymbr/goose-docker:3.27.1
    volumes:
      - ./db/migrations:/migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://weeto:weeto@postgres:5432/weeto?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL: postgres://weeto:weeto@postgres:5432/weeto?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      DB_URL: postgres://weeto:weeto@postgres:5432/weeto?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  postgres_data:
