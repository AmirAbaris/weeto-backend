openapi: 3.0.3
info:
  title: Weeto API
  description: |
    Interview scheduling API for hiring teams.

    **Authentication**
    - `POST /auth/register` or `POST /auth/login` returns a short-lived `access_token` in the JSON body.
    - A long-lived `refresh_token` is set as an HttpOnly cookie (`refresh_token`).
    - Protected routes require `Authorization: Bearer <access_token>`.
    - `POST /auth/refresh` and `POST /auth/logout` use the `refresh_token` cookie (no request body).
  version: 0.1.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness checks
  - name: Auth
    description: Registration, login, and token lifecycle
  - name: Organizations
    description: Recruiter organization management
  - name: InterviewTypes
    description: Interview type configuration
  - name: Availability
    description: Recruiter availability and slot generation rules

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "201":
          description: User created and tokens issued
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: Tokens issued
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate access and refresh tokens
      description: Uses the `refresh_token` HttpOnly cookie set by register/login.
      operationId: refresh
      security:
        - refreshTokenCookie: []
      responses:
        "200":
          description: New token pair issued
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token and clear cookie
      description: Uses the `refresh_token` HttpOnly cookie set by register/login.
      operationId: logout
      security:
        - refreshTokenCookie: []
      responses:
        "204":
          description: Refresh token revoked
          headers:
            Set-Cookie:
              description: Clears the refresh_token cookie
              schema:
                type: string
                example: refresh_token=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization
      operationId: createOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: User already has an organization or slug is taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /organizations/me:
    get:
      tags: [Organizations]
      summary: Get the authenticated user's organization
      operationId: getMyOrganization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /organizations/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Organizations]
      summary: Get organization by ID
      operationId: getOrganizationByID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Organizations]
      summary: Update organization
      operationId: updateOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Organizations]
      summary: Delete organization
      operationId: deleteOrganization
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Organization deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /organizations/{id}/logo:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    patch:
      tags: [Organizations]
      summary: Update organization logo
      operationId: updateOrganizationLogo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLogoRequest"
      responses:
        "200":
          description: Logo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /interview-types:
    post:
      tags: [InterviewTypes]
      summary: Create an interview type
      operationId: createInterviewType
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewTypeRequest"
      responses:
        "201":
          description: Interview type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Free plan interview type limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "404":
          description: Organization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already taken within organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Google account not connected for google_meet provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [InterviewTypes]
      summary: List interview types for the authenticated user's organization
      operationId: listInterviewTypes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Interview types found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewTypeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Organization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /interview-types/{id}:
    parameters:
      - $ref: "#/components/parameters/InterviewTypeID"
    put:
      tags: [InterviewTypes]
      summary: Update an interview type
      operationId: updateInterviewType
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewTypeRequest"
      responses:
        "200":
          description: Interview type updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Slug already taken within organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Google account not connected for google_meet provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /availability:
    put:
      tags: [Availability]
      summary: Replace organization availability settings
      operationId: upsertAvailability
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
      responses:
        "200":
          description: Availability saved and slots regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Organization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Availability]
      summary: Get organization availability settings
      operationId: getAvailability
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current availability configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Availability or organization not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `POST /auth/register`, `POST /auth/login`, or `POST /auth/refresh`.
        Paste only the token value; Swagger UI adds the `Bearer` prefix.
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly cookie set automatically by register/login responses.

  parameters:
    OrganizationID:
      name: id
      in: path
      required: true
      description: Organization UUID
      schema:
        type: string
        format: uuid

    InterviewTypeID:
      name: id
      in: path
      required: true
      description: Interview type UUID
      schema:
        type: string
        format: uuid

  headers:
    RefreshTokenCookie:
      description: HttpOnly refresh token cookie
      schema:
        type: string
        example: refresh_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Path=/; Max-Age=604800; HttpOnly; Secure; SameSite=Strict

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: recruiter@company.com
        password:
          type: string
          format: password
          minLength: 8
          example: securepass123

    TokenResponse:
      type: object
      required: [access_token, expires_in, token_type]
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        token_type:
          type: string
          example: Bearer

    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 100
          example: Acme Corp
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 2
          maxLength: 48
          example: acme-corp
        logo_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.com/logo.png

    UpdateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 100
          example: Acme Corp
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 2
          maxLength: 48
          example: acme-corp
        logo_url:
          type: string
          format: uri
          nullable: true
        plan:
          $ref: "#/components/schemas/PlanType"

    UpdateLogoRequest:
      type: object
      required: [logo_url]
      properties:
        logo_url:
          type: string
          format: uri
          example: https://cdn.example.com/logo.png

    PlanType:
      type: string
      enum: [free, pro, business]
      example: free

    OrganizationResponse:
      type: object
      required: [id, name, slug, owner_id, plan, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        logo_url:
          type: string
          format: uri
          nullable: true
        owner_id:
          type: string
          format: uuid
        plan:
          $ref: "#/components/schemas/PlanType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid credentials

    ErrorDetail:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: connect google to use google meet interview types
        code:
          type: string
          example: google_not_connected
        action:
          type: string
          example: connect_google
        action_url:
          type: string
          example: /integrations/google/connect

    MeetingProvider:
      type: string
      enum: [google_meet, bale_link, custom_url]
      example: bale_link

    InterviewTypeRequest:
      type: object
      required: [title, slug, duration_minutes, meeting_provider]
      properties:
        title:
          type: string
          maxLength: 100
          example: Frontend Interview
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 2
          maxLength: 48
          example: frontend
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
          example: 45
        buffer_minutes:
          type: integer
          minimum: 0
          maximum: 120
          default: 0
          example: 15
        meeting_provider:
          $ref: "#/components/schemas/MeetingProvider"
        meeting_url:
          type: string
          format: uri
          nullable: true
          description: Required for bale_link and custom_url; must be omitted for google_meet
          example: https://ble.ir/join/abc

    InterviewTypeResponse:
      type: object
      required:
        - id
        - organization_id
        - title
        - slug
        - duration_minutes
        - buffer_minutes
        - meeting_provider
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        duration_minutes:
          type: integer
        buffer_minutes:
          type: integer
        meeting_provider:
          $ref: "#/components/schemas/MeetingProvider"
        meeting_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AvailabilityWorkingHour:
      type: object
      required: [day_of_week, start_time, end_time]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=Sunday through 6=Saturday
          example: 1
        start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'
          example: "09:00"
        end_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'
          example: "17:00"

    AvailabilityBreak:
      type: object
      required: [day_of_week, start_time, end_time]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        start_time:
          type: string
          example: "12:00"
        end_time:
          type: string
          example: "13:00"

    AvailabilityTimeOff:
      type: object
      required: [start_at, end_at]
      properties:
        start_at:
          type: string
          format: date-time
          example: "2026-07-10T06:30:00Z"
        end_at:
          type: string
          format: date-time
          example: "2026-07-10T10:30:00Z"

    AvailabilityRequest:
      type: object
      required: [max_interviews_per_day, working_hours]
      properties:
        timezone:
          type: string
          default: Asia/Tehran
          example: Asia/Tehran
        max_interviews_per_day:
          type: integer
          minimum: 1
          maximum: 50
          example: 4
        working_hours:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityWorkingHour"
        breaks:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityBreak"
        time_off:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityTimeOff"

    AvailabilityResponse:
      type: object
      required: [timezone, max_interviews_per_day, working_hours, breaks, time_off]
      properties:
        timezone:
          type: string
        max_interviews_per_day:
          type: integer
        working_hours:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AvailabilityWorkingHour"
              - type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  created_at:
                    type: string
                    format: date-time
        breaks:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AvailabilityBreak"
              - type: object
                properties:
                  id:
                    type: string
                    format: uuid
        time_off:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AvailabilityTimeOff"
              - type: object
                properties:
                  id:
                    type: string
                    format: uuid
        updated_at:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Invalid request body or validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not allowed to access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
